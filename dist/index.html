    <!-- Immediate Theme Initialization Script (Prevents flash and guarantees Black/White theme persistence on reload) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('study_tracker_eye_care');
          if (!saved) {
            var m = document.cookie.match(/(?:^|; )study_tracker_eye_care=([^;]*)/);
            if (m) saved = m[1];
          }
          if (!saved) {
            var t = localStorage.getItem('study_tracker_theme');
            if (t === 'black' || t === 'dark') saved = 'true';
            else if (t === 'white' || t === 'light') saved = 'false';
          }
          if (saved === 'true') {
            document.documentElement.classList.add('eye-care-black');
            document.documentElement.classList.remove('theme-light-blue');
          } else if (saved === 'false') {
            document.documentElement.classList.add('theme-light-blue');
            document.documentElement.classList.remove('eye-care-black');
          }
        } catch (e) {}
      })();
    </script>
